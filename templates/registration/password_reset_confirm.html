{% extends "base.html" %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-aside"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Choose a<br>new password<span class="green-dot">.</span></h1></div><div class="auth-card">{% if validlink %}<form method="post" class="form-stack">{% csrf_token %}{{ form.as_p }}<button class="button full-width" type="submit">Update password <span aria-hidden="true">→</span></button></form>{% else %}<h2>This reset link is no longer valid.</h2><p class="form-foot"><a href="{% url 'password_reset' %}">Request another link</a></p>{% endif %}</div></section>
{% endblock %}
