{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="auth-wrap"><div class="auth-aside"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>A fresh<br>start<span class="green-dot">.</span></h1><p>Enter the email address linked to your account to request a password reset.</p></div><div class="auth-card"><p class="eyebrow">RESET PASSWORD</p><h2>Request a reset link</h2><form method="post" class="form-stack">{% csrf_token %}{{ form.as_p }}<button class="button full-width" type="submit">Send reset link <span aria-hidden="true">→</span></button></form></div></section>
{% endblock %}
