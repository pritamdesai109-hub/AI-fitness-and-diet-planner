<figure class="line-chart-figure">
  <svg class="line-chart" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ chart_label }}">
    {% for tick in chart.y_ticks %}
    <line class="chart-gridline" x1="{{ chart.left }}" y1="{{ tick.y }}" x2="{{ chart.right }}" y2="{{ tick.y }}"></line>
    <text class="chart-y-label" x="{{ chart.left|add:'-10' }}" y="{{ tick.y|add:'4' }}" text-anchor="end">{{ tick.label }}</text>
    {% endfor %}
    {% for tick in chart.x_ticks %}
    <line class="chart-x-tick" x1="{{ tick.x }}" y1="{{ chart.top }}" x2="{{ tick.x }}" y2="{{ chart.bottom }}"></line>
    <text class="chart-x-label" x="{{ tick.x }}" y="{{ chart.height|add:'-10' }}" text-anchor="middle">{{ tick.label }}</text>
    {% endfor %}
    {% for series_item in chart.series %}
      {% for path in series_item.paths %}<polyline class="chart-line chart-line-{{ series_item.key }}" points="{{ path }}"></polyline>{% endfor %}
      {% for marker in series_item.markers %}<circle class="chart-point chart-point-{{ series_item.key }}" cx="{{ marker.x }}" cy="{{ marker.y }}" r="3"><title>{{ marker.title }}</title></circle>{% endfor %}
    {% endfor %}
  </svg>
  <figcaption class="chart-legend">{% for series_item in chart.series %}<span class="legend-{{ series_item.key }}">{{ series_item.label }}</span>{% endfor %}</figcaption>
</figure>
